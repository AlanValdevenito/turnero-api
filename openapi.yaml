openapi: 3.0.3
info:
  title: Negro API
  version: 0.9.4
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://api.9521.com.ar/negro-test
    description: Test
  - url: https://api.9521.com.ar/negro-prod
    description: Producción

paths:
  /version:
    get:
      summary: Obtener versión de la API
      responses:
        '200':
          description: Versión actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "1.0.0"

  /reset:
    post:
      summary: Reiniciar datos (solo test)
      responses:
        '200':
          description: Datos reiniciados
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Datos reiniciados
        '403':
          description: Prohibido fuera del entorno de test
  /test/hora_mock:
    post:
      summary: Setear hora mock (solo test)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hora:
                  type: string
                  example: "10:04"
      responses:
        '200':
          description: Hora mock seteada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hora mock seteada a 10:04
        '400':
          description: Error en los datos enviados
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '403':
          description: Prohibido fuera del entorno de test

    delete:
      summary: Cancelar hora mock (solo test)
      responses:
        '200':
          description: Hora mock cancelada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hora mock cancelada
        '403':
          description: Prohibido fuera del entorno de test

  /especialidades:
    get:
      summary: Listar especialidades
      responses:
        '200':
          description: Lista de especialidades
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    nombre:
                      type: string
                    duracion_de_turnos:
                      type: integer
    post:
      summary: Crear especialidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                duracion_de_turnos:
                  type: integer
      responses:
        '200':
          description: Especialidad creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: La especialidad fue dada de alta correctamente.
                  id:
                    type: integer

  /medicos:
    get:
      summary: Listar médicos
      responses:
        '200':
          description: Lista de médicos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    nombre:
                      type: string
                    apellido:
                      type: string
                    matricula:
                      type: string
                    especialidad:
                      type: string
    post:
      summary: Crear médico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                apellido:
                  type: string
                matricula:
                  type: string
                especialidad:
                  type: string
      responses:
        '200':
          description: Médico creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: El médico fue dado de alta correctamente.
                  id:
                    type: integer

  /usuarios:
    get:
      summary: Listar usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    email:
                      type: string
                      format: email
    post:
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                telegram_id:
                  type: integer
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  telegram_id:
                    type: integer
                  message:
                    type: string
                    example: El paciente se registró existosamente
        '400':
          description: Error en los datos enviados

  /usuarios/{email}:
    get:
      summary: Buscar usuario por email
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Usuario encontrado
        '404':
          description: Usuario no encontrado

  /usuarios/telegram/{telegram_id}:
    get:
      summary: Buscar usuario por telegram_id
      parameters:
        - in: path
          name: telegram_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario encontrado
        '404':
          description: Usuario no encontrado

  /turnos/medicos-disponibles:
    get:
      summary: Listar médicos con turnos disponibles
      responses:
        '200':
          description: Lista de médicos

  /turnos/{matricula}/disponibilidad:
    get:
      summary: Disponibilidad de un médico
      parameters:
        - in: path
          name: matricula
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Disponibilidad encontrada
        '400':
          description: Sin turnos disponibles
        '404':
          description: Médico no encontrado

  /turnos/pacientes/{email}:
    get:
      summary: Turnos de un paciente por email
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de turnos
        '404':
          description: Paciente inexistente

  /turnos/pacientes/proximos/{email}:
    get:
      summary: Próximos turnos de un paciente por email
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de próximos turnos
        '400':
          description: El paciente no tiene próximos turnos

  /turnos/pacientes/historial/{email}:
    get:
      summary: Historial de turnos de un paciente por email
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de turnos en historial
        '400':
          description: El paciente no tiene turnos en su historial

  /turnos/medicos/{matricula}:
    get:
      summary: Turnos de un médico
      parameters:
        - in: path
          name: matricula
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de turnos
        '404':
          description: Médico inexistente

  /turnos:
    post:
      summary: Crear turno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matricula:
                  type: string
                fecha:
                  type: string
                hora:
                  type: string
                email:
                  type: string
      responses:
        '201':
          description: Turno creado
        '400':
          description: Error en los datos enviados
        '404':
          description: Usuario o médico no encontrado

  /turnos/{id}:
    put:
      summary: Modificar estado de un turno
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado:
                  type: string
      responses:
        '200':
          description: Turno actualizado
        '400':
          description: Error de validación
        '404':
          description: Turno no encontrado
        '409':
          description: Conflicto de estado
